name: Generate action docs

# Regenerates docs/actions/** from the action configs whenever they change on
# main, and merges the result through a pull request. The path filter deliberately
# excludes docs/** so the bot's own commit cannot retrigger this workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'configurations/**'
  workflow_dispatch:
    inputs:
      merge:
        description: 'Merge the docs PR automatically (leave unticked to review it first)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: generate-docs
  cancel-in-progress: false

jobs:
  generate-docs:
    name: Generate and commit action docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        # Latest main, not the triggering commit, so a queued run includes the docs the last one merged
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate docs
        run: CI=true npm run docs:smoke

      - name: Stage docs changes
        id: docs
        env:
          DOCS_BRANCH: docs/regenerate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git add docs/actions
          if git diff --cached --quiet -- docs/actions; then
            echo "No documentation changes to commit."
            exit 0
          fi
          echo "branch=$DOCS_BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # main's ruleset rejects direct pushes, so merge through a PR as publish.yml does for releases
      - name: Commit docs, then open, check and merge the pull request
        if: steps.docs.outputs.branch != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #9.0.0
        env:
          DOCS_BRANCH: ${{ steps.docs.outputs.branch }}
          HEAD_SHA: ${{ steps.docs.outputs.head_sha }}
          MERGE_DOCS_PR: ${{ github.event_name == 'push' || inputs.merge }}
        with:
          script: |
            const fs = require('node:fs')
            const { owner, repo } = context.repo
            const title = 'docs: regenerate action documentation [skip ci]'

            const { stdout } = await exec.getExecOutput('git', [
              'diff', '--cached', '--name-status', '--no-renames', '--', 'docs/actions'
            ])
            const additions = []
            const deletions = []
            for (const line of stdout.trim().split('\n')) {
              const [status, path] = line.split('\t')
              if (status === 'D') {
                deletions.push({ path })
              } else {
                additions.push({ path, contents: fs.readFileSync(path).toString('base64') })
              }
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${process.env.DOCS_BRANCH}`,
              sha: process.env.HEAD_SHA
            })

            // Committed through the API so GitHub signs it, as changesets/action does for the release PR
            await github.graphql(
              `mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: `${owner}/${repo}`,
                    branchName: process.env.DOCS_BRANCH
                  },
                  message: { headline: title },
                  expectedHeadOid: process.env.HEAD_SHA,
                  fileChanges: { additions, deletions }
                }
              }
            )

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: process.env.DOCS_BRANCH,
              base: 'main',
              body: 'Regenerated by the Generate action docs workflow.'
            })

            // PRs opened with GITHUB_TOKEN trigger no workflows, so the required checks never run
            for (const name of ['validate-changeset-check', 'Run Pull Request Checks']) {
              await github.rest.checks.create({
                owner,
                repo,
                name,
                head_sha: pr.head.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Required check triggered',
                  summary: `Check created for docs PR #${pr.number}`
                }
              })
            }

            if (process.env.MERGE_DOCS_PR !== 'true') {
              core.notice(`Docs PR left open for review: ${pr.html_url}`)
              return
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: title
            })

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${process.env.DOCS_BRANCH}`
            })
