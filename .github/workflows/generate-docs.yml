name: Generate action docs

# Regenerates docs/actions/** from the action configs whenever they change on
# main, and merges the result through a pull request. The path filter deliberately
# excludes docs/** so the bot's own commit cannot retrigger this workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'configurations/**'
  workflow_dispatch:
    inputs:
      merge:
        description: 'Merge the docs PR automatically (leave unticked to review it first)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: generate-docs
  cancel-in-progress: false

jobs:
  generate-docs:
    name: Generate and commit action docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        # Latest main, not the triggering commit, so a queued run includes the docs the last one merged
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate docs
        run: CI=true npm run docs:smoke

      - name: Commit docs to a branch
        id: commit
        env:
          DOCS_BRANCH: docs/regenerate-${{ github.run_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- docs/actions; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git checkout -b "$DOCS_BRANCH"
          git add docs/actions
          git commit -m "docs: regenerate action documentation [skip ci]"
          git push origin "$DOCS_BRANCH"
          echo "branch=$DOCS_BRANCH" >> "$GITHUB_OUTPUT"

      # main's ruleset rejects direct pushes, so merge through a PR as publish.yml does for releases
      - name: Open, check and merge the docs pull request
        if: steps.commit.outputs.branch != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #9.0.0
        env:
          DOCS_BRANCH: ${{ steps.commit.outputs.branch }}
          MERGE_DOCS_PR: ${{ github.event_name == 'push' || inputs.merge }}
        with:
          script: |
            const { owner, repo } = context.repo
            const title = 'docs: regenerate action documentation [skip ci]'

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: process.env.DOCS_BRANCH,
              base: 'main',
              body: 'Regenerated by the Generate action docs workflow.'
            })

            // PRs opened with GITHUB_TOKEN trigger no workflows, so the required check never runs
            await github.rest.checks.create({
              owner,
              repo,
              name: 'validate-changeset-check',
              head_sha: pr.head.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Required check triggered',
                summary: `Check created for docs PR #${pr.number}`
              }
            })

            if (process.env.MERGE_DOCS_PR !== 'true') {
              core.notice(`Docs PR left open for review: ${pr.html_url}`)
              return
            }

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              commit_title: title
            })

            await github.rest.git.deleteRef({
              owner,
              repo,
              ref: `heads/${process.env.DOCS_BRANCH}`
            })
